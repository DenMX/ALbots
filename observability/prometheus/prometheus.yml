global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    queue_config:
      max_samples_per_send: 2000
      max_shards: 2
      capacity: 4000

scrape_configs:
  - job_name: albots
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      # PC with the bot client in the same LAN as this server.
      # If DenXM-PC does not resolve from Linux, replace with the PC IP, e.g. 192.168.1.42:9100
      - targets: ["192.168.6.7:9100"]
        labels:
          instance: denxm-pc
          env: home
